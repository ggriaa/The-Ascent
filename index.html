async function findNearestCrunch(lat, lng) {
  try {
    const query = `[out:json][timeout:8];nwr["name"~"Crunch Fitness",i](around:50000,${lat},${lng});out center tags;`;
    const url = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query);
    const response = await fetch(url, { headers: { Accept: 'application/json' } });
    if (!response.ok) throw Error('Crunch lookup unavailable');
    const data = await response.json();
    const items = (data.elements || []).map(el => {
      const clat = el.lat ?? el.center?.lat;
      const clng = el.lon ?? el.center?.lon;
      if (clat == null || clng == null) return null;
      const rad = x => x * Math.PI / 180, R = 6371000;
      const dLat = rad(clat - lat), dLon = rad(clng - lng);
      const a = Math.sin(dLat/2)**2 + Math.cos(rad(lat))*Math.cos(rad(clat))*Math.sin(dLon/2)**2;
      const distance = Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
      return { name: el.tags?.name || 'Crunch Fitness', distance };
    }).filter(Boolean).sort((a,b) => a.distance - b.distance);
    return items[0] || null;
  } catch (_) { return null; }
}

async handleUpload(e){const files=[...e.target.files];if(!files.length)return;view.busy=true;render();try{const{data:sub,error:se}=await sb.from('submissions').insert({mission_id:state.mission.id,user_id:state.user.id,type:'photo',status:'pending'}).select().single();if(se)throw se;for(const f of files){const b=await compressImageBlob(f),path=`${state.user.id}/${sub.id}/${crypto.randomUUID()}.jpg`,{error:ue}=await sb.storage.from('ascent-photos').upload(path,b,{contentType:'image/jpeg'});if(ue)throw ue;const{error:pe}=await sb.from('submission_photos').insert({submission_id:sub.id,storage_path:path});if(pe)throw pe}if(!state.mission.start_date)await sb.from('missions').update({start_date:new Date().toISOString()}).eq('id',state.mission.id);await loadData()}catch(e){view.authError=e.message||'Upload failed.'}view.busy=false;render()},
 async submitTextLog(){const day=document.getElementById('f-day')?.value||'',start=document.getElementById('f-start')?.value||'',end=document.getElementById('f-end')?.value||'';if(!day||!start||!end){view.authError='Enter the day, start time, and end time.';render();return}view.busy=true;render();const{error}=await sb.from('submissions').insert({mission_id:state.mission.id,user_id:state.user.id,type:'text',day,start_time:start,end_time:end,status:'pending'});if(!error&&!state.mission.start_date)await sb.from('missions').update({start_date:new Date().toISOString()}).eq('id',state.mission.id);view.busy=false;if(error)view.authError=error.message;else{view.authError='';await loadData()}render()},async decide(id,status){const note=document.getElementById(`note-${id}`)?.value?.trim()||null;view.busy=true;render();const{error}=await sb.from('submissions').update({status,admin_notes:note}).eq('id',id);if(error)view.authError=error.message;else await loadData();view.busy=false;render()},async saveNote(id){const note=document.getElementById(`note-${id}`)?.value?.trim()||null;view.busy=true;render();const{error}=await sb.from('submissions').update({admin_notes:note}).eq('id',id);if(error)view.authError=error.message;else await loadData();view.busy=false;render()},openModal(id,idx){const s=state.submissions.find(x=>x.id===id);if(!s||!s.images?.[idx])return;const o=document.createElement('div');o.className='modal-overlay';o.onclick=()=>o.remove();o.innerHTML=`<img src="${s.images[idx]}" alt="Proof photo">`;document.body.appendChild(o)},async resetMission(){if(!confirm('Reset all progress and submissions?'))return;view.busy=true;render();const{error}=await sb.from('submissions').delete().eq('mission_id',state.mission.id);if(!error){await sb.from('missions').update({start_date:null}).eq('id',state.mission.id);await loadData()}else view.authError=error.message;view.busy=false;render()}}
async function loadProfile(){const{data,error}=await sb.from('profiles').select('*').eq('id',state.user.id).maybeSingle();if(error){view.authError=error.message;return}state.profile=data;await loadData()}
async function loadData(){const{data:m}=await sb.from('missions').select('*').order('created_at',{ascending:false}).limit(1).maybeSingle();state.mission=m;state.missionName=m?.mission_name||DEFAULT_NAME;state.startDate=m?.start_date||null;state.setupComplete=!!m?.setup_complete;const{data:s,error}=await sb.from('submissions').select('*').order('created_at',{ascending:true});if(error){state.submissions=[];return}const subs=s||[],ids=subs.map(x=>x.id);let map={};if(ids.length){const{data:ph}=await sb.from('submission_photos').select('*').in('submission_id',ids),paths=(ph||[]).map(p=>p.storage_path);let signed={};if(paths.length){const{data:u}=await sb.storage.from('ascent-photos').createSignedUrls(paths,3600);(u||[]).forEach(r=>{if(r.signedUrl)signed[r.path]=r.signedUrl})}(ph||[]).forEach(p=>{if(!map[p.submission_id])map[p.submission_id]=[];if(signed[p.storage_path])map[p.submission_id].push(signed[p.storage_path])})}state.submissions=subs.map(x=>({id:x.id,userId:x.user_id,status:x.status,type:x.type,images:map[x.id]||[],day:x.day,startTime:x.start_time,endTime:x.end_time,ts:x.created_at,checkinLatitude:x.checkin_latitude,checkinLongitude:x.checkin_longitude,checkinAccuracyMeters:x.checkin_accuracy_meters,locationName:x.checkin_location_name,checkinDistanceMeters:x.checkin_distance_meters,checkinWarning:x.checkin_warning,adminNotes:x.admin_notes}))}
sb.auth.onAuthStateChange((_e,s)=>{if(s&&!state.user){state.user=s.user;loadProfile().then(()=>{view.screen='home';render()})}});window.Ascent=Ascent;Ascent.load();
