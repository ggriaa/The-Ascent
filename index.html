<style>

/* Admin queue */
#ascent-root .queue-item { padding: 14px 0; border-bottom: 1px solid var(--panel-line); }

<script>
(function(){
  const STORAGE_KEY = 'ascent-mission-state';
  const THIRTY_DAYS = 30*24*60*60*1000;
  const DEFAULT_NAME = 'THE ASCENT';
  const CADET_LABEL = 'Jordan Smith | Log Submissions';

  let state = null;
  let view = { screen: 'loading', passError: '', setupErr: '', busy: false, uploadMode: 'photo' };

  function defaultState(){
    return {
      setupComplete: false,
      missionName: '',
      adminPassword: '',
      code8: '',
      code16: '',
      code20: '',
      startDate: null,
      submissions: []
    };
  }

  async function loadState(){
    try{
      const res = await window.storage.get(STORAGE_KEY, true);
      return res && res.value ? JSON.parse(res.value) : null;
    }catch(e){ return null; }
  }

  async function saveState(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
      return true;
    }catch(e){
      console.error('sync failed', e);
      return false;
    }
  }

  function approvedCount(){
    return state.submissions.filter(s=>s.status==='approved').length;
  }

  function checkExpiry(){
    if(state.startDate && approvedCount() < 20){
      const elapsed = Date.now() - new Date(state.startDate).getTime();
      if(elapsed > THIRTY_DAYS){
        state.startDate = null;
        state.submissions = [];
        return true;
      }
    }
    return false;
  }

  function fmtDate(iso){
    const d = new Date(iso);
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' · ' + d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  }

  function fmtDay(dayStr){
    if(!dayStr) return '';
    const d = new Date(dayStr + 'T00:00:00');
    return d.toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'});
  }

  function fmtTime12(t){
    if(!t) return '';
    const [h,m] = t.split(':').map(Number);
    const period = h >= 12 ? 'PM' : 'AM';
    const h12 = h % 12 === 0 ? 12 : h % 12;
    return h12 + ':' + String(m).padStart(2,'0') + ' ' + period;
  }

  function timeRemaining(){
    if(!state.startDate) return null;
    const elapsed = Date.now() - new Date(state.startDate).getTime();
    const left = THIRTY_DAYS - elapsed;
    if(left <= 0) return {days:0, hours:0, expired:true};
    const days = Math.floor(left/(24*60*60*1000));
    const hours = Math.floor((left%(24*60*60*1000))/(60*60*1000));
    return {days, hours, expired:false};
  }

  function esc(s){
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  // ---------- image compression ----------
  function compressImage(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('read failed'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('decode failed'));
        img.onload = () => {
          const maxDim = 760;
          let w = img.width, h = img.height;
          if(w > h && w > maxDim){ h = Math.round(h * maxDim/w); w = maxDim; }
          else if(h > maxDim){ w = Math.round(w * maxDim/h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.55));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // ---------- render ----------
  function render(){
    const app = document.getElementById('app');
    if(view.screen === 'loading'){
      app.innerHTML = `<div class="empty-state">Loading…</div>`;
      return;
    }
    if(view.screen === 'home') return renderHome(app);
    if(view.screen === 'setup') return renderSetup(app);
    if(view.screen === 'passwordGate') return renderPasswordGate(app);
    if(view.screen === 'cadet') return renderCadet(app);
    if(view.screen === 'commander') return renderCommander(app);
  }

  function missionName(){
    return state.missionName ? state.missionName.toUpperCase() : DEFAULT_NAME;
  }

  function renderHome(app){
    app.innerHTML = `
      <div class="home-mark">✦ A Journey In 20 Missions ✦</div>
      <p class="eyebrow">Current Status</p>
      <h1 class="title">${esc(missionName())}</h1>
      <p class="subtitle">${state.setupComplete ? 'Twenty successful missions stand between here and the reward at the top.' : "Setup hasn't been completed yet."}</p>
      <div class="home-buttons">
        <button class="btn btn-solid" onclick="Ascent.goCadet()">${esc(CADET_LABEL)}</button>
        <button class="btn" onclick="Ascent.goCommanderGate()">Admin Access</button>
      </div>
      <p class="sync-note">Progress and submissions are saved automatically — you'll both see the same updates from any device.</p>
    `;
  }

  function renderSetup(app){
    app.innerHTML = `
      <p class="eyebrow">Setup</p>
      <h1 class="title">Set Up The Journey</h1>
      <p class="subtitle">Fill these in before sharing the link with them. You'll need these codes later, so write them down somewhere safe.</p>
      <div class="panel">
        <label>Journey Name <span style="color:var(--muted); text-transform:none; letter-spacing:0;">(optional)</span></label>
        <input type="text" id="f-name" placeholder="${DEFAULT_NAME}" maxlength="40">

        <label>Admin Password</label>
        <input type="password" id="f-pass" placeholder="Choose a password" maxlength="40">
        <div class="hint">You'll enter this each time you open Admin Access.</div>

        <label>Starting Container Code</label>
        <input type="tel" id="f-code8" placeholder="e.g. 391" maxlength="6" inputmode="numeric">
        <div class="hint">Unlocks on their screen after mission 8.</div>

        <label>Small Container Code</label>
        <input type="tel" id="f-code16" placeholder="e.g. 427" maxlength="6" inputmode="numeric">
        <div class="hint">Unlocks on their screen after mission 16.</div>

        <label>Big Container Code</label>
        <input type="tel" id="f-code20" placeholder="e.g. 8139" maxlength="8" inputmode="numeric">
        <div class="hint">Unlocks on their screen after mission 20.</div>

        ${view.setupErr ? `<div class="error-text">${esc(view.setupErr)}</div>` : ''}

        <div style="margin-top:18px;">
          <button class="btn btn-solid" onclick="Ascent.submitSetup()">Save &amp; Start</button>
        </div>
      </div>
      <button class="btn btn-ghost" onclick="Ascent.goHome()">← Back</button>
    `;
  }

  function renderPasswordGate(app){
    app.innerHTML = `
      <p class="eyebrow">Admin Access</p>
      <h1 class="title">Enter Your Password</h1>
      <p class="subtitle">This keeps the review panel just for you.</p>
      <div class="panel">
        <label>Password</label>
        <input type="password" id="f-passentry" placeholder="••••••••" maxlength="40">
        ${view.passError ? `<div class="error-text">${esc(view.passError)}</div>` : ''}
        <div style="margin-top:18px;">
          <button class="btn btn-solid" onclick="Ascent.submitPassword()">Enter</button>
        </div>
      </div>
      <button class="btn btn-ghost" onclick="Ascent.goHome()">← Back</button>
    `;
    const el = document.getElementById('f-passentry');
    if(el){ el.focus(); el.addEventListener('keydown', e=>{ if(e.key==='Enter') window.Ascent.submitPassword(); }); }
  }

  function renderCadet(app){
    if(!state.setupComplete){
      app.innerHTML = `
        <p class="eyebrow">Your Progress</p>
        <h1 class="title">${esc(missionName())}</h1>
        <div class="panel"><p class="empty-state">This journey hasn't been set up yet. Check back soon.</p></div>
        <button class="btn btn-ghost" onclick="Ascent.goHome()">← Back</button>
      `;
      return;
    }

    const approved = approvedCount();
    const complete = approved >= 20;
    const rem = timeRemaining();

    // ---- Upload panel (shown first) ----
    let uploadBody;
    if(complete){
      uploadBody = `<button class="btn btn-solid" disabled>Journey Complete 🎉</button>`;
    } else {
      const photoTabHtml = `
        <div class="file-input-wrap">
          <button class="btn btn-solid">Upload Photo(s)</button>
          <input type="file" accept="image/*" capture="environment" multiple id="f-photo" onchange="Ascent.handleUpload(event)">
        </div>
        <div class="hint">Snap one or more photos from today's workout. They'll show up together for review.</div>
      `;
      const textTabHtml = `
        <label>Day</label>
        <input type="date" id="f-day">
        <div class="row">
          <div>
            <label>Start Time</label>
            <input type="time" id="f-start">
          </div>
          <div>
            <label>End Time</label>
            <input type="time" id="f-end">
          </div>
        </div>
        ${view.setupErr ? '' : ''}
        <div style="margin-top:14px;">
          <button class="btn btn-solid" onclick="Ascent.submitTextLog()">Submit Log Entry</button>
        </div>
        <div class="hint">No photo handy? Log the day and time of your workout instead.</div>
      `;
      uploadBody = `
        <div class="row" style="margin-bottom:14px;">
          <button class="btn btn-tab ${view.uploadMode==='photo' ? 'active' : ''}" onclick="Ascent.setUploadMode('photo')">Photo Proof</button>
          <button class="btn btn-tab ${view.uploadMode==='text' ? 'active' : ''}" onclick="Ascent.setUploadMode('text')">Log Time Instead</button>
        </div>
        ${view.uploadMode === 'photo' ? photoTabHtml : textTabHtml}
      `;
    }
    const uploadHtml = `
      <div class="panel">
        <p class="panel-label">Submit Evidence</p>
        ${uploadBody}
        ${view.busy ? '<div class="hint">Uploading…</div>' : ''}
      </div>
    `;

    // ---- Time panel ----
    let clockHtml;
    if(!state.startDate){
      clockHtml = `<div class="clock-value">Not started yet</div><div class="clock-sub">Submit your first entry to start the 30-day countdown.</div>`;
    } else if(complete){
      clockHtml = `<div class="clock-value" style="color:var(--green)">Journey complete!</div><div class="clock-sub">Nice work — you made it all the way.</div>`;
    } else {
      clockHtml = `<div class="clock-value">${rem.days}d ${rem.hours}h left</div><div class="clock-sub">Started ${fmtDate(state.startDate)}. If time runs out before mission 20, progress resets to the start.</div>`;
    }

    // ---- Trail: mission 1 at top, 20 at bottom ----
    let trailHtml = '';
    for(let i=1; i<=20; i++){
      const isDone = i <= approved;
      const isNextPending = !isDone && state.submissions.some(s=>s.status==='pending') && i === approved+1;
      let dotClass = 'node-dot';
      let dotContent = i;
      if(i===8 || i===16 || i===20) dotClass += ' special';
      if(isNextPending){ dotClass += ' pending'; }
      if(isDone){ dotClass += ' filled'; dotContent = '✓'; }

      let tag = '';
      if(i===8) tag = '<span class="node-tag">Starting Container</span>';
      if(i===16) tag = '<span class="node-tag">Small Container</span>';
      if(i===20) tag = '<span class="node-tag">Big Container</span>';

      trailHtml += `
        <div class="trail-node ${isDone ? 'done' : ''}">
          <div class="${dotClass}">${dotContent}</div>
          <div class="node-label"><b>Successful Mission ${i}</b>${tag}</div>
        </div>
      `;
    }

    let cipherHtml = '';
    if(approved >= 20){
      cipherHtml = `
        <div class="panel cipher-panel">
          <p class="panel-label">Mission 20 Complete — Big Container Unlocked</p>
          <div class="cipher-digits">${state.code20.split('').map(d=>`<div class="cipher-digit">${esc(d)}</div>`).join('')}</div>
          <p class="cipher-caption">Here's the code for the big container. You did it!</p>
        </div>
      `;
    } else if(approved >= 16){
      cipherHtml = `
        <div class="panel cipher-panel">
          <p class="panel-label">Mission 16 Complete — Small Container Unlocked</p>
          <div class="cipher-digits">${state.code16.split('').map(d=>`<div class="cipher-digit">${esc(d)}</div>`).join('')}</div>
          <p class="cipher-caption">Here's the code for the small container. Four more missions unlocks the big one.</p>
        </div>
      `;
    } else if(approved >= 8){
      cipherHtml = `
        <div class="panel cipher-panel">
          <p class="panel-label">Mission 8 Complete — Starting Container Unlocked</p>
          <div class="cipher-digits">${state.code8.split('').map(d=>`<div class="cipher-digit">${esc(d)}</div>`).join('')}</div>
          <p class="cipher-caption">Here's the code for the starting container. Eight more missions unlocks the next one.</p>
        </div>
      `;
    }

    let logHtml = '';
    const recent = [...state.submissions].reverse().slice(0, 12);
    if(recent.length === 0){
      logHtml = `<p class="empty-state">No submissions yet.</p>`;
    } else {
      logHtml = recent.map(s => {
        let thumbHtml;
        if(s.type === 'text'){
          thumbHtml = `<div class="log-thumb-text">${esc(fmtDay(s.day))}</div>`;
        } else {
          const extra = (s.images && s.images.length > 1) ? `<div class="log-thumb-badge">+${s.images.length - 1}</div>` : '';
          thumbHtml = `<div class="log-thumb-wrap"><img class="log-thumb" src="${s.images[0]}" onclick="Ascent.openModal('${s.id}',0)" alt="Proof photo">${extra}</div>`;
        }
        const metaLine = s.type === 'text'
          ? `${fmtTime12(s.startTime)} – ${fmtTime12(s.endTime)}`
          : fmtDate(s.ts);
        return `
        <div class="log-entry">
          ${thumbHtml}
          <div class="log-meta">
            <div class="log-date">${metaLine}</div>
          </div>
          <div class="stamp ${s.status}">${s.status === 'pending' ? 'Pending' : s.status === 'approved' ? 'Approved' : 'Not approved'}</div>
        </div>
      `;
      }).join('');
    }

    app.innerHTML = `
      <p class="eyebrow">Your Progress</p>
      <h1 class="title">${esc(missionName())}</h1>
      <p class="subtitle">${approved} of 20 successful missions completed.</p>

      ${uploadHtml}

      <div class="panel">
        <p class="panel-label">Time Left</p>
        ${clockHtml}
      </div>

      <div class="panel">
        <p class="panel-label">Your Path</p>
        <div class="trail">${trailHtml}</div>
      </div>

      ${cipherHtml}

      <div class="panel">
        <p class="panel-label">Submission History</p>
        ${logHtml}
      </div>

      <button class="btn btn-ghost" onclick="Ascent.goHome()">← Back</button>
    `;

    if(view.uploadMode === 'text' && !complete){
      const dayEl = document.getElementById('f-day');
      if(dayEl && view.draftDay) dayEl.value = view.draftDay;
      const startEl = document.getElementById('f-start');
      if(startEl && view.draftStart) startEl.value = view.draftStart;
      const endEl = document.getElementById('f-end');
      if(endEl && view.draftEnd) endEl.value = view.draftEnd;
    }
  }

  function renderCommander(app){
    const approved = approvedCount();
    const pending = state.submissions.filter(s=>s.status==='pending');
    const rem = timeRemaining();

    const queueHtml = pending.length === 0
      ? `<p class="empty-state">Nothing to review right now.</p>`
      : [...pending].reverse().map(s => {
          let evidenceHtml;
          if(s.type === 'text'){
            evidenceHtml = `
              <div class="queue-text-card">
                <div class="queue-text-day">${esc(fmtDay(s.day))}</div>
                <div class="queue-text-time">${esc(fmtTime12(s.startTime))} – ${esc(fmtTime12(s.endTime))}</div>
              </div>
            `;
          } else {
            evidenceHtml = `<div class="queue-img-grid">${s.images.map((img,idx) => `<img class="queue-img" src="${img}" onclick="Ascent.openModal('${s.id}',${idx})" alt="Proof photo">`).join('')}</div>`;
          }
          return `
          <div class="queue-item">
            ${evidenceHtml}
            <div class="queue-date">Submitted ${fmtDate(s.ts)}</div>
            <div class="row">
              <button class="btn btn-signal" onclick="Ascent.decide('${s.id}','approved')">Approve</button>
              <button class="btn btn-rust" onclick="Ascent.decide('${s.id}','rejected')">Reject</button>
            </div>
          </div>
        `;
        }).join('');

    app.innerHTML = `
      <p class="eyebrow">Admin Panel</p>
      <h1 class="title">${esc(missionName())}</h1>
      <p class="subtitle">${state.startDate ? (rem.expired ? 'Countdown has expired.' : rem.days + 'd ' + rem.hours + 'h left') : "Countdown hasn't started — no submissions yet."}</p>

      <div class="stat-row">
        <div class="stat-box"><div class="stat-num">${approved}/20</div><div class="stat-label">Approved</div></div>
        <div class="stat-box"><div class="stat-num">${pending.length}</div><div class="stat-label">To Review</div></div>
      </div>

      <div class="panel">
        <p class="panel-label">Submissions To Review</p>
        ${queueHtml}
        ${view.busy ? '<div class="hint">Syncing…</div>' : ''}
      </div>

      <div class="panel">
        <p class="panel-label">Settings</p>
        <button class="btn btn-rust" onclick="Ascent.resetMission()">Reset Progress</button>
        <div class="hint">Clears all progress and submissions. Your codes and password stay the same.</div>
      </div>

      <button class="btn btn-ghost" onclick="Ascent.goHome()">← Back</button>
    `;
  }

  // ---------- actions ----------
  const Ascent = {
    goHome(){ view.screen = 'home'; view.passError=''; view.setupErr=''; render(); },
    goCadet(){ view.screen = 'cadet'; render(); },
    goCommanderGate(){
      view.screen = state.setupComplete ? 'passwordGate' : 'setup';
      render();
    },

    setUploadMode(mode){
      view.uploadMode = mode;
      render();
    },

    async submitSetup(){
      const name = document.getElementById('f-name').value.trim();
      const pass = document.getElementById('f-pass').value;
      const c8 = document.getElementById('f-code8').value.trim();
      const c16 = document.getElementById('f-code16').value.trim();
      const c20 = document.getElementById('f-code20').value.trim();
      if(!pass || pass.length < 4){ view.setupErr = 'Password must be at least 4 characters.'; render(); return; }
      if(!c8){ view.setupErr = 'Add a code for the starting container (mission 8).'; render(); return; }
      if(!c16){ view.setupErr = 'Add a code for the small container (mission 16).'; render(); return; }
      if(!c20){ view.setupErr = 'Add a code for the big container (mission 20).'; render(); return; }
      state.missionName = name;
      state.adminPassword = pass;
      state.code8 = c8;
      state.code16 = c16;
      state.code20 = c20;
      state.setupComplete = true;
      view.setupErr = '';
      await saveState();
      view.screen = 'commander';
      render();
    },

    submitPassword(){
      const val = document.getElementById('f-passentry').value;
      if(val === state.adminPassword){
        view.passError = '';
        view.screen = 'commander';
        render();
      } else {
        view.passError = "That's not the right password. Try again.";
        render();
      }
    },

    async handleUpload(evt){
      const files = Array.from(evt.target.files || []);
      if(files.length === 0) return;
      view.busy = true; render();
      try{
        const images = [];
        for(const file of files){
          images.push(await compressImage(file));
        }
        const sub = {
          id: 'p' + Date.now() + Math.random().toString(36).slice(2,7),
          type: 'photo',
          images,
          ts: new Date().toISOString(),
          status: 'pending'
        };
        if(!state.startDate) state.startDate = new Date().toISOString();
        state.submissions.push(sub);
        await saveState();
      }catch(e){
        console.error(e);
      }
      view.busy = false;
      render();
    },

    async submitTextLog(){
      const day = document.getElementById('f-day').value;
      const start = document.getElementById('f-start').value;
      const end = document.getElementById('f-end').value;
      if(!day || !start || !end){
        view.draftDay = day; view.draftStart = start; view.draftEnd = end;
        alert('Please fill in the day, start time, and end time.');
        return;
      }
      view.busy = true; render();
      const sub = {
        id: 't' + Date.now() + Math.random().toString(36).slice(2,7),
        type: 'text',
        day, startTime: start, endTime: end,
        ts: new Date().toISOString(),
        status: 'pending'
      };
      if(!state.startDate) state.startDate = new Date().toISOString();
      state.submissions.push(sub);
      view.draftDay = ''; view.draftStart = ''; view.draftEnd = '';
      await saveState();
      view.busy = false;
      render();
    },

    async decide(id, status){
      const sub = state.submissions.find(s=>s.id===id);
      if(!sub) return;
      sub.status = status;
      view.busy = true; render();
      await saveState();
      view.busy = false;
      render();
    },

    async resetMission(){
      if(!confirm('Reset all progress and clear the submission history? Your codes and password stay the same.')) return;
      state.startDate = null;
      state.submissions = [];
      view.busy = true; render();
      await saveState();
      view.busy = false;
      render();
    },

    openModal(id, startIdx){
      const sub = state.submissions.find(s=>s.id===id);
      if(!sub || sub.type !== 'photo') return;
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.id = 'ascent-modal';
      overlay.onclick = () => overlay.remove();
      const img = document.createElement('img');
      img.src = sub.images[startIdx || 0];
      overlay.appendChild(img);
      document.getElementById('ascent-root').appendChild(overlay);
    }
  };
  window.Ascent = Ascent;

  async function init(){
    let loaded = await loadState();
    state = loaded || defaultState();
    checkExpiry();
    await saveState();
    view.screen = 'home';
    render();
  }
  init();
})();
</script>
