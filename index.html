function renderSetup(a){a.innerHTML=`<p class="eyebrow">Setup</p><h1 class="title">Set Up The Journey</h1><div class="panel"><label>Journey Name</label><input type="text" id="f-name" placeholder="${DEFAULT_NAME}" maxlength="40"><label>Starting Container Code</label><input type="tel" id="f-code8" maxlength="6"><label>Small Container Code</label><input type="tel" id="f-code16" maxlength="6"><label>Big Container Code</label><input type="tel" id="f-code20" maxlength="8">${view.setupErr?`<div class="error-text">${esc(view.setupErr)}</div>`:''}<div style="margin-top:18px"><button class="btn btn-solid" onclick="Ascent.submitSetup()">Save &amp; Start</button></div></div><button class="btn btn-ghost" onclick="Ascent.goHome()">← Back</button>`}
function renderCadet(a){
 if(!state.setupComplete){a.innerHTML=`<p class="eyebrow">Your Progress</p><h1 class="title">${titleHtml()}</h1><div class="submission-controls">
  <button class="btn btn-solid checkin-main-btn" onclick="Ascent.locationCheckIn()">CHECK IN AT LOCATION</button>
  <div class="secondary-options">
    <button class="btn btn-tab" onclick="Ascent.openProofModal('photo')">PHOTO PROOF</button>
    <button class="btn btn-tab" onclick="Ascent.openProofModal('text')">LOG TIME</button>
  </div>
</div>`;return}

async function findNearestCrunch(lat, lng) {
  try {
    const query = `[out:json][timeout:8];nwr["name"~"Crunch Fitness",i](around:50000,${lat},${lng});out center tags;`;
    const url = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query);
    const response = await fetch(url, { headers: { Accept: 'application/json' } });
    if (!response.ok) throw Error('Crunch lookup unavailable');
    const data = await response.json();
    const items = (data.elements || []).map(el => {
      const clat = el.lat ?? el.center?.lat;
      const clng = el.lon ?? el.center?.lon;
      if (clat == null || clng == null) return null;
      const rad = x => x * Math.PI / 180, R = 6371000;
      const dLat = rad(clat - lat), dLon = rad(clng - lng);
      const a = Math.sin(dLat/2)**2 + Math.cos(rad(lat))*Math.cos(rad(clat))*Math.sin(dLon/2)**2;
      const distance = Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
      return { name: el.tags?.name || 'Crunch Fitness', distance };
    }).filter(Boolean).sort((a,b) => a.distance - b.distance);
    return items[0] || null;
  } catch (_) { return null; }
}

<script id="kaizen-ios-zoom-guard">
(function(){
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('gestureend', function(e){ e.preventDefault(); }, {passive:false});
  let lastTouchEnd=0;
  document.addEventListener('touchend', function(e){
    const now=Date.now();
    if(now-lastTouchEnd<=300 && !e.target.closest('input,textarea,select,button,[contenteditable="true"]')){
      e.preventDefault();
    }
    lastTouchEnd=now;
  }, {passive:false});
})();

<script id="kaizen-timer-refresh">
(function(){
  var intervalId = null;

  function updateCountdown(){
    try{
      var root=document.getElementById('ascent-root');
      if(!root) return;

      var countdown=root.querySelector('.kaizen-countdown');
      var daysEl=root.querySelector('.countdown-number');
      var parts=root.querySelectorAll('.countdown-time b');

      if(!countdown || !daysEl || parts.length<3) return;

      var startValue=countdown.getAttribute('data-start');
      if(!startValue) return;

      var startMs=Date.parse(startValue);
      if(!Number.isFinite(startMs)) return;

      var remaining=(30*24*60*60*1000)-(Date.now()-startMs);
      if(remaining<0) remaining=0;

      var days=Math.floor(remaining/86400000);
      var hours=Math.floor((remaining%86400000)/3600000);
      var minutes=Math.floor((remaining%3600000)/60000);
      var seconds=Math.floor((remaining%60000)/1000);

      daysEl.textContent=String(days);
      parts[0].textContent=String(hours).padStart(2,'0');
      parts[1].textContent=String(minutes).padStart(2,'0');
      parts[2].textContent=String(seconds).padStart(2,'0');
    }catch(e){}
  }

  function start(){
    if(intervalId!==null) clearInterval(intervalId);
    updateCountdown();
    intervalId=setInterval(updateCountdown,1000);
  }

  // Start after the page has rendered, then keep the interval independent of
  // the app's render cycle.
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',start,{once:true});
  }else{
    start();
  }
})();
</script>
