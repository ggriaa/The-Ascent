async function findNearestCrunch(lat, lng) {
  try {
    const query = `[out:json][timeout:8];nwr["name"~"Crunch Fitness",i](around:50000,${lat},${lng});out center tags;`;
    const url = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query);
    const response = await fetch(url, { headers: { Accept: 'application/json' } });
    if (!response.ok) throw Error('Crunch lookup unavailable');
    const data = await response.json();
    const items = (data.elements || []).map(el => {
      const clat = el.lat ?? el.center?.lat;
      const clng = el.lon ?? el.center?.lon;
      if (clat == null || clng == null) return null;
      const rad = x => x * Math.PI / 180, R = 6371000;
      const dLat = rad(clat - lat), dLon = rad(clng - lng);
      const a = Math.sin(dLat/2)**2 + Math.cos(rad(lat))*Math.cos(rad(clat))*Math.sin(dLon/2)**2;
      const distance = Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
      return { name: el.tags?.name || 'Crunch Fitness', distance };
    }).filter(Boolean).sort((a,b) => a.distance - b.distance);
    return items[0] || null;
  } catch (_) { return null; }
}

async locationCheckIn(){view.locationStatus='Requesting location…';view.authError='';view.busy=true;render();try{
  if(!navigator.geolocation)throw Error('Location is not available on this device.');
  const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:20000,maximumAge:0}));
  const{latitude,longitude,accuracy}=pos.coords;
  const nearest=await findNearestCrunch(latitude,longitude);
  let warning='';
  if(nearest){ warning=nearest.distance>1000?`Location is approximately ${nearest.distance} meters from the nearest mapped Crunch Fitness location.`:''; }
  else warning='Nearest Crunch Fitness location could not be automatically verified. Manual review required.';
  const{error}=await sb.from('submissions').insert({mission_id:state.mission.id,user_id:state.user.id,type:'location',status:'pending',checkin_latitude:latitude,checkin_longitude:longitude,checkin_accuracy_meters:accuracy,checkin_location_name:nearest?.name||'Crunch Fitness — manual verification',checkin_distance_meters:nearest?.distance??null,checkin_warning:warning||null});
  if(error)throw error;
  view.locationStatus=warning?'Location submitted for manual review.':'Location submitted for approval.';
  Ascent.showSubmissionSuccess('LOCATION CHECK-IN');
  await loadData();
}catch(e){view.authError=e?.code===1?'Location permission was denied.':(e.message||'Location check-in failed.');view.locationStatus=''}view.busy=false;render()},
async handleUpload(e){
  const files = Array.from((e.target && e.target.files) || []);
  if (!files.length) return;
  view.actionStatus = {text:'Preparing photo submission…',type:'info'};
  view.authError = '';
  view.busy = true;
  render();
  try {
    if (!state || !state.user || !state.user.id) throw new Error('Please sign in again before submitting a photo.');
    if (!state.mission || !state.mission.id) throw new Error('The mission is not available. Please reload the page.');

    const result = await sb.from('submissions').insert({
      mission_id:state.mission.id,user_id:state.user.id,type:'photo',status:'pending'
    }).select().single();
    if (result.error) throw new Error('Could not create the submission: ' + result.error.message);

    const sub = result.data;
    try {
      for (const file of files) {
        const blob = await compressImageBlob(file);
        const original = blob === file;
        const ext = original
          ? (((file.name || 'photo').split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg')
          : 'jpg';
        const contentType = blob.type || file.type || 'image/jpeg';
        const path = state.user.id + '/' + sub.id + '/' + Date.now() + '-' + Math.random().toString(36).slice(2) + '.' + ext;

        const upload = await sb.storage.from('jiritsu-photos').upload(path,blob,{contentType:contentType,upsert:false});
        if (upload.error) throw new Error('Photo upload failed: ' + upload.error.message);

        const photoRow = await sb.from('submission_photos').insert({submission_id:sub.id,storage_path:path});
        if (photoRow.error) throw new Error('Could not save the photo record: ' + photoRow.error.message);
      }
    } catch (uploadError) {
      await sb.from('submission_photos').delete().eq('submission_id',sub.id);
      await sb.from('submissions').delete().eq('id',sub.id);
      throw uploadError;
    }

    view.actionStatus = {text:'Photo submitted!',type:'success'};
    closeProofModalIfOpen();
    Ascent.showSubmissionSuccess('PHOTO PROOF');
    await loadData();
  } catch (err) {
    view.authError = err && err.message ? err.message : 'Photo submission failed.';
    view.actionStatus = {text:'',type:'info'};
  }
  view.busy = false;
  render();
},

<script id="kaizen-ios-zoom-guard">
(function(){
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('gestureend', function(e){ e.preventDefault(); }, {passive:false});
  let lastTouchEnd=0;
  document.addEventListener('touchend', function(e){
    const now=Date.now();
    if(now-lastTouchEnd<=300 && !e.target.closest('input,textarea,select,button,[contenteditable="true"]')){
      e.preventDefault();
    }
    lastTouchEnd=now;
  }, {passive:false});
})();
</script>





<script id="kaizen-timer-refresh">
(function(){
  var intervalId = null;

  function updateCountdown(){
    try{
      var root=document.getElementById('ascent-root');
      if(!root) return;

      var countdown=root.querySelector('.kaizen-countdown');
      var daysEl=root.querySelector('.countdown-number');
      var parts=root.querySelectorAll('.countdown-time b');

      if(!countdown || !daysEl || parts.length<3) return;

      var startValue=countdown.getAttribute('data-start');
      if(!startValue) return;

      var startMs=Date.parse(startValue);
      if(!Number.isFinite(startMs)) return;

      var remaining=(30*24*60*60*1000)-(Date.now()-startMs);
      if(remaining<0) remaining=0;

      var days=Math.floor(remaining/86400000);
      var hours=Math.floor((remaining%86400000)/3600000);
      var minutes=Math.floor((remaining%3600000)/60000);
      var seconds=Math.floor((remaining%60000)/1000);

      daysEl.textContent=String(days);
      parts[0].textContent=String(hours).padStart(2,'0');
      parts[1].textContent=String(minutes).padStart(2,'0');
      parts[2].textContent=String(seconds).padStart(2,'0');
    }catch(e){}
  }

  function start(){
    if(intervalId!==null) clearInterval(intervalId);
    updateCountdown();
    intervalId=setInterval(updateCountdown,1000);
  }

  // Start after the page has rendered, then keep the interval independent of
  // the app's render cycle.
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',start,{once:true});
  }else{
    start();
  }
})();
</script>
