#ascent-root .panel-label { font-family:'Rajdhani',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin:0 0 14px; }
#ascent-root .btn { font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;letter-spacing:.06em;background:transparent;border:1px solid var(--panel-line);color:var(--text);padding:14px 18px;border-radius:10px;cursor:pointer;width:100%;transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease,background .12s ease;text-align:center; }
#ascent-root .btn:hover { border-color:var(--accent);transform:translateY(-1px); } #ascent-root .btn:active{transform:scale(.98)} #ascent-root .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
#ascent-root .btn-solid { background:linear-gradient(120deg,var(--accent),#9E936D);border:1px solid var(--accent-bright);color:#18160F; } #ascent-root .btn-solid:hover{box-shadow:0 6px 18px rgba(201,185,138,.25)}

#ascent-root .btn-rust{border-color:var(--rust);color:var(--rust)} #ascent-root .btn-rust:hover{background:rgba(184,121,94,.12);box-shadow:0 4px 14px rgba(184,121,94,.15)}

#ascent-root .btn-tab{background:transparent;border:1px solid var(--panel-line);color:var(--muted)} #ascent-root .btn-tab.active{border-color:var(--accent);color:var(--accent-bright);background:rgba(201,185,138,.08)}

#ascent-root label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px} #ascent-root label:first-child{margin-top:0}
#ascent-root input[type=text],#ascent-root input[type=password],#ascent-root input[type=tel],#ascent-root input[type=date],#ascent-root input[type=time]{width:100%;background:var(--void);border:1px solid var(--panel-line);border-radius:10px;color:var(--text);padding:12px 14px;font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:.03em;color-scheme:dark} #ascent-root input:focus{outline:2px solid var(--accent);border-color:var(--accent)}

#ascent-root .node-dot{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--panel-line);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;color:var(--muted);background:var(--panel);position:relative;z-index:1} #ascent-root .node-dot.special{width:32px;height:32px;border-color:var(--accent);color:var(--accent)} #ascent-root .node-dot.pending{border-color:var(--accent);color:var(--accent);animation:pulseDot 1.6s ease-in-out infinite} #ascent-root .node-dot.filled{border-color:var(--green);background:linear-gradient(135deg,var(--green),#687A4B);color:#15200D;box-shadow:0 0 10px rgba(145,165,107,.35)}
@keyframes pulseDot{0%,100%{opacity:1;box-shadow:0 0 0 rgba(201,185,138,0)}50%{opacity:.55;box-shadow:0 0 10px rgba(201,185,138,.35)}}
#ascent-root .node-label{font-size:12.5px;color:var(--muted)} #ascent-root .node-label b{color:var(--text);font-weight:600} #ascent-root .node-tag{font-family:'Rajdhani',sans-serif;font-size:10.5px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;margin-left:6px}
#ascent-root .cipher-panel{border-color:var(--accent);background:linear-gradient(180deg,rgba(201,185,138,.12),rgba(201,185,138,.03))} #ascent-root .cipher-digits{display:flex;gap:8px;margin-top:12px} #ascent-root .cipher-digit{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:28px;width:44px;height:54px;display:flex;align-items:center;justify-content:center;background:var(--void);border:1px solid var(--accent);border-radius:10px;color:var(--accent-bright);animation:glow 2.4s ease-in-out infinite} @keyframes glow{0%,100%{box-shadow:0 0 0 rgba(201,185,138,0)}50%{box-shadow:0 0 16px rgba(201,185,138,.35)}} #ascent-root .cipher-caption{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.5}
#ascent-root .log-entry{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--panel-line);align-items:center} #ascent-root .log-entry:last-child{border-bottom:none;padding-bottom:0} #ascent-root .log-thumb-wrap{position:relative;flex-shrink:0} #ascent-root .log-thumb{width:48px;height:48px;object-fit:cover;border:1px solid var(--panel-line);border-radius:8px;cursor:pointer;display:block} #ascent-root .log-thumb-badge{position:absolute;bottom:-4px;right:-4px;background:var(--accent);color:#18160F;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:10px;padding:1px 5px;border-radius:20px} #ascent-root .log-thumb-text{width:48px;height:48px;border:1px solid var(--panel-line);border-radius:8px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--void);font-family:'Rajdhani',sans-serif;color:var(--accent);font-size:9.5px;font-weight:700;letter-spacing:.05em;line-height:1.3;text-align:center} #ascent-root .log-meta{flex:1;min-width:0} #ascent-root .log-date{font-size:12.5px;color:var(--text)} #ascent-root .log-note{font-size:11.5px;color:var(--muted);margin-top:2px} #ascent-root .stamp{font-family:'Rajdhani',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:20px;border:1px solid currentColor;flex-shrink:0} #ascent-root .stamp.pending{color:var(--accent)} #ascent-root .stamp.approved{color:var(--green)} #ascent-root .stamp.rejected{color:var(--rust)}
#ascent-root .queue-item{padding:14px 0;border-bottom:1px solid var(--panel-line)} #ascent-root .queue-item:last-child{border-bottom:none} #ascent-root .queue-img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin-bottom:10px} #ascent-root .queue-img{width:100%;height:140px;object-fit:cover;background:var(--void);border:1px solid var(--panel-line);border-radius:10px;cursor:zoom-in} #ascent-root .queue-text-card{background:var(--void);border:1px solid var(--panel-line);border-radius:12px;padding:14px;margin-bottom:10px} #ascent-root .queue-text-day{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:17px;color:var(--accent-bright)} #ascent-root .queue-text-time{font-size:13px;color:var(--text);margin-top:4px} #ascent-root .queue-date{font-size:12.5px;color:var(--muted);margin-bottom:10px} #ascent-root .empty-state{color:var(--muted);font-size:13px;text-align:center;padding:24px 0} #ascent-root .stat-row{display:flex;gap:12px;margin-bottom:4px} #ascent-root .stat-box{flex:1;background:var(--void);border:1px solid var(--panel-line);border-radius:12px;padding:14px;text-align:center} #ascent-root .stat-num{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:24px;color:var(--accent-bright)} #ascent-root .stat-label{font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-top:3px} #ascent-root .sync-note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:22px;line-height:1.5}
#ascent-root .modal-overlay{position:fixed;inset:0;background:rgba(27,25,21,.94);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto} #ascent-root .modal-overlay img{max-width:100%;max-height:90vh;border-radius:12px;border:1px solid var(--accent-dim)} #ascent-root .file-input-wrap{position:relative} #ascent-root .file-input-wrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
@media(max-width:400px){#ascent-root h1.title{font-size:29px}#ascent-root .cipher-digit{width:37px;height:47px;font-size:24px}}
</style>
<div id="ascent-root"><div class="bg-field"></div><div class="shell" id="app"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://gakkgsbjtmjhebdayvtl.supabase.co';
const SUPABASE_KEY='sb_publishable_fEe0HFjLyGuNu0vqodHpeg_QntdbKKF';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const DEFAULT_NAME='THE ASCENT';const CADET_LABEL='Jordan Smith | Log Submissions';
const JORDAN_ID='Jordan';const JORDAN_EMAIL='ggriaa999@gmail.com';
const view={screen:'loading',authError:'',setupErr:'',busy:false,uploadMode:'photo',draftDay:'',draftStart:'',draftEnd:''};
const state={user:null,profile:null,mission:null,missionName:'',startDate:null,submissions:[],setupComplete:false};
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function fmtDate(v){return v?new Date(v).toLocaleDateString():'—'}
function fmtDay(v){return v?new Date(v+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}):'—'}
function fmtTime12(v){if(!v)return'—';const [h,m]=v.split(':').map(Number);const d=new Date();d.setHours(h,m,0,0);return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
function approvedCount(){return state.submissions.filter(s=>s.status==='approved'&&s.userId===state.user?.id).length}
function timeRemaining(){if(!state.startDate)return null;const left=30*24*60*60*1000-(Date.now()-new Date(state.startDate).getTime());if(left<=0)return {days:0,hours:0,expired:true};return {days:Math.floor(left/(24*60*60*1000)),hours:Math.floor((left%(24*60*60*1000))/(60*60*1000)),expired:false};}
function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('read failed'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('decode failed'));img.onload=()=>{const maxDim=760;let w=img.width,h=img.height;if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim}else if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',.55));};img.src=reader.result;};reader.readAsDataURL(file);});}
function render(){const app=document.getElementById('app');if(view.screen==='loading'){app.innerHTML='<div class="empty-state">Loading…</div>';return}if(view.screen==='home')return renderHome(app);if(view.screen==='setup')return renderSetup(app);if(view.screen==='cadet')return renderCadet(app);if(view.screen==='commander')return renderCommander(app);}
function missionName(){return state.missionName?state.missionName.toUpperCase():DEFAULT_NAME;}
function renderHome(app){
 if(!state.user){app.innerHTML=`<div class="home-mark">✦ A Journey In 20 Missions ✦</div><p class="eyebrow">Secure Access</p><h1 class="title">THE ASCENT</h1><p class="subtitle">Sign in to access your mission console.</p><div class="panel"><label>Access ID</label><input type="text" id="f-email" placeholder="Enter Access ID" autocomplete="username"><label>Password</label><input type="password" id="f-login-pass" placeholder="••••••••" autocomplete="current-password">${view.authError?`<div class="error-text">${esc(view.authError)}</div>`:''}<div style="margin-top:18px"><button class="btn btn-solid" onclick="Ascent.login()">Sign In</button></div><button class="btn btn-ghost" style="margin-top:10px" onclick="Ascent.resetPassword()">Forgot password?</button></div><p class="sync-note">Mission data and submissions are stored securely online and sync across devices.</p>`;const p=document.getElementById('f-login-pass');if(p)p.addEventListener('keydown',e=>{if(e.key==='Enter')window.Ascent.login()});return;}
 const isAdmin=state.profile?.role==='admin';app.innerHTML=`<div class="home-mark">✦ A Journey In 20 Missions ✦</div><p class="eyebrow">Authenticated</p><h1 class="title">${esc(missionName())}</h1><p class="subtitle">Signed in as ${esc(isAdmin ? (state.user.email||'') : 'Jordan')}.</p><div class="home-buttons"><button class="btn btn-solid" onclick="${isAdmin?'Ascent.goCommanderGate()':'Ascent.goCadet()'}">${isAdmin?'Admin Access':CADET_LABEL}</button>${isAdmin?'<button class="btn" onclick="Ascent.goCadet()">Preview Cadet View</button>':''}<button class="btn btn-ghost" onclick="Ascent.logout()">Sign Out</button></div><p class="sync-note">Progress and submissions are saved automatically and available from any device.</p>`;
}
function renderSetup(app){app.innerHTML=`<p class="eyebrow">Setup</p><h1 class="title">Set Up The Journey</h1><p class="subtitle">Fill these in before sharing the link with them. These codes are saved to the mission database.</p><div class="panel"><label>Journey Name <span style="color:var(--muted);text-transform:none;letter-spacing:0">(optional)</span></label><input type="text" id="f-name" placeholder="${DEFAULT_NAME}" maxlength="40"><label>Starting Container Code</label><input type="tel" id="f-code8" placeholder="e.g. 391" maxlength="6" inputmode="numeric"><div class="hint">Unlocks on their screen after mission 8.</div><label>Small Container Code</label><input type="tel" id="f-code16" placeholder="e.g. 427" maxlength="6" inputmode="numeric"><div class="hint">Unlocks on their screen after mission 16.</div><label>Big Container Code</label><input type="tel" id="f-code20" placeholder="e.g. 8139" maxlength="8" inputmode="numeric">${view.setupErr?`<div class="error-text">${esc(view.setupErr)}</div>`:''}<div style="margin-top:18px"><button class="btn btn-solid" onclick="Ascent.submitSetup()">Save &amp; Start</button></div></div><button class="btn btn-ghost" onclick="Ascent.goHome()">← Back</button>`;}
function renderCadet(app){
 if(!state.setupComplete){app.innerHTML=`<p class="eyebrow">Your Progress</p><h1 class="title">${esc(missionName())}</h1><div class="panel"><p class="empty-state">This journey hasn't been set up yet. Check back soon.</p></div><button class="btn btn-ghost" onclick="Ascent.goHome()">← Back</button>`;return;}
 const approved=approvedCount(),complete=approved>=20,rem=timeRemaining();let uploadBody;
 if(complete)uploadBody='<button class="btn btn-solid" disabled>Journey Complete</button>';else{const photoTab=`<div class="file-input-wrap"><button class="btn btn-solid">Upload Photo(s)</button><input type="file" accept="image/*" capture="environment" multiple id="f-photo" onchange="Ascent.handleUpload(event)"></div><div class="hint">Snap one or more photos from today's workout. They'll show up together for review.</div>`,textTab=`<label>Day</label><input type="date" id="f-day"><div class="row"><div><label>Start Time</label><input type="time" id="f-start"></div><div><label>End Time</label><input type="time" id="f-end"></div></div><div style="margin-top:14px"><button class="btn btn-solid" onclick="Ascent.submitTextLog()">Submit Log Entry</button></div><div class="hint">No photo handy? Log the day and time of your workout instead.</div>`;uploadBody=`<div class="row" style="margin-bottom:14px"><button class="btn btn-tab ${view.uploadMode==='photo'?'active':''}" onclick="Ascent.setUploadMode('photo')">Photo Proof</button><button class="btn btn-tab ${view.uploadMode==='text'?'active':''}" onclick="Ascent.setUploadMode('text')">Log Time Instead</button></div>${view.uploadMode==='photo'?photoTab:textTab}`;}
 const uploadHtml=`<div class="panel"><p class="panel-label">Submit Evidence</p>${uploadBody}${view.busy?'<div class="hint">Syncing…</div>':''}${view.authError?`<div class="error-text">${esc(view.authError)}</div>`:''}</div>`;
 let clockHtml;if(!state.startDate)clockHtml='<div class="clock-value">Not started yet</div><div class="clock-sub">Submit your first entry to start the 30-day countdown.</div>';else if(complete)clockHtml='<div class="clock-value" style="color:var(--green)">Journey complete!</div><div class="clock-sub">Nice work — you made it all the way.</div>';else clockHtml=`<div class="clock-value">${rem.days}d ${rem.hours}h left</div><div class="clock-sub">Started ${fmtDate(state.startDate)}. If time runs out before mission 20, progress resets to the start.</div>`;
 let trailHtml='';for(let i=1;i<=20;i++){const done=i<=approved,pending=!done&&state.submissions.some(s=>s.status==='pending'&&s.userId===state.user?.id);trailHtml+=`<div class="trail-node ${done?'done':''}"><div class="node-dot ${done?'filled':pending?'pending':''}">${done?'✓':i}</div><div class="node-label"><b>Mission ${i}</b>${done?'<span class="node-tag">Approved</span>':pending?'<span class="node-tag">Pending</span>':''}</div></div>`;}
 let cipherHtml='';
 const recent=[...state.submissions].filter(s=>s.userId===state.user.id).reverse().slice(0,12);let logHtml=recent.length?recent.map(s=>{let thumb=s.type==='text'?`<div class="log-thumb-text">${esc(fmtDay(s.day))}</div>`:`<div class="log-thumb-wrap"><img class="log-thumb" src="${s.images[0]||''}" onclick="Ascent.openModal('${s.id}',0)" alt="Proof photo">${s.images.length>1?`<div class="log-thumb-badge">+${s.images.length-1}</div>`:''}</div>`;return `<div class="log-entry">${thumb}<div class="log-meta"><div class="log-date">${s.type==='text'?fmtTime12(s.startTime)+' – '+fmtTime12(s.endTime):fmtDate(s.ts)}</div></div><div class="stamp ${s.status}">${s.status==='pending'?'Pending':s.status==='approved'?'Approved':'Not approved'}</div></div>`}).join(''):'<p class="empty-state">No submissions yet.</p>';
 app.innerHTML=`<h1 class="title">${esc(missionName())}</h1><p class="subtitle">${approved} of 20 successful missions completed.</p><div class="panel"><p class="panel-label">Submission History</p>${logHtml}</div><p class="eyebrow" style="margin-top:28px">Your Progress</p>${uploadHtml}<div class="panel"><p class="panel-label">Time Left</p>${clockHtml}</div><div class="panel"><p class="panel-label">Your Path</p><div class="trail">${trailHtml}</div></div>${cipherHtml}<button class="btn btn-ghost" onclick="Ascent.goHome()">← Back</button>`;
 if(view.uploadMode==='text'&&!complete){const d=document.getElementById('f-day'),st=document.getElementById('f-start'),en=document.getElementById('f-end');if(d&&view.draftDay)d.value=view.draftDay;if(st&&view.draftStart)st.value=view.draftStart;if(en&&view.draftEnd)en.value=view.draftEnd;}
}
function renderCommander(app){if(state.profile?.role!=='admin'){view.screen='home';render();return;}const approved=approvedCount(),pending=state.submissions.filter(s=>s.status==='pending'),rem=timeRemaining();const queueHtml=pending.length===0?'<p class="empty-state">Nothing to review right now.</p>':[...pending].reverse().map(s=>{let evidence=s.type==='text'?`<div class="queue-text-card"><div class="queue-text-day">${esc(fmtDay(s.day))}</div><div class="queue-text-time">${esc(fmtTime12(s.startTime))} – ${esc(fmtTime12(s.endTime))}</div></div>`:`<div class="queue-img-grid">${s.images.map((img,idx)=>`<img class="queue-img" src="${img}" onclick="Ascent.openModal('${s.id}',${idx})" alt="Proof photo">`).join('')}</div>`;return `<div class="queue-item">${evidence}<div class="queue-date">Submitted ${fmtDate(s.ts)}</div><div class="row"><button class="btn btn-signal" onclick="Ascent.decide('${s.id}','approved')">Approve</button><button class="btn btn-rust" onclick="Ascent.decide('${s.id}','rejected')">Reject</button></div></div>`}).join('');app.innerHTML=`<p class="eyebrow">Admin Panel</p><h1 class="title">${esc(missionName())}</h1><p class="subtitle">${state.startDate?(rem.expired?'Countdown has expired.':rem.days+'d '+rem.hours+'h left'):"Countdown hasn't started — no submissions yet."}</p><div class="stat-row"><div class="stat-box"><div class="stat-num">${approved}/20</div><div class="stat-label">Approved</div></div><div class="stat-box"><div class="stat-num">${pending.length}</div><div class="stat-label">To Review</div></div></div><div class="panel"><p class="panel-label">Submissions To Review</p>${queueHtml}${view.busy?'<div class="hint">Syncing…</div>':''}${view.authError?`<div class="error-text">${esc(view.authError)}</div>`:''}</div><div class="panel"><p class="panel-label">Settings</p><button class="btn btn-rust" onclick="Ascent.resetMission()">Reset Progress</button><div class="hint">Clears all progress and submissions.</div></div><button class="btn btn-ghost" onclick="Ascent.goHome()">← Back</button>`;}
const Ascent={
 async login(){view.authError='';const raw=(document.getElementById('f-email')?.value||'').trim();const pass=document.getElementById('f-login-pass')?.value||'';const email=raw.toLowerCase()==='jordan'?JORDAN_EMAIL:raw;if(!email||!pass){view.authError='Enter your access ID and password.';render();return;}view.busy=true;render();const {data,error}=await sb.auth.signInWithPassword({email,password:pass});view.busy=false;if(error){view.authError=error.message;render();return;}state.user=data.user;await loadProfile();view.screen='home';render();},
 async logout(){await sb.auth.signOut();state.user=null;state.profile=null;view.screen='home';render();},
 async resetPassword(){const raw=(document.getElementById('f-email')?.value||'').trim();const email=raw.toLowerCase()==='jordan'?JORDAN_EMAIL:raw;if(!email){view.authError='Enter your access ID first.';render();return;}const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});view.authError=error?error.message:'Password recovery email sent.';render();},
 goHome(){view.screen='home';render();},
 goCadet(){view.screen='cadet';render();},
 goCommanderGate(){if(state.profile?.role==='admin'){view.screen='commander';render();}else{view.screen='home';render();}},
 setUploadMode(m){view.uploadMode=m;render();},
 async load(){const {data}=await sb.auth.getSession();if(data.session){state.user=data.session.user;await loadProfile();}view.screen='home';render();},
 async submitSetup(){view.setupErr='';view.busy=true;render();const name=(document.getElementById('f-name')?.value||DEFAULT_NAME).trim();const code8=(document.getElementById('f-code8')?.value||'').trim();const code16=(document.getElementById('f-code16')?.value||'').trim();const code20=(document.getElementById('f-code20')?.value||'').trim();const {data,error}=await sb.from('missions').upsert({mission_name:name,start_date:null,code_8:code8||null,code_16:code16||null,code_20:code20||null},{onConflict:'id'}).select().single();view.busy=false;if(error){view.setupErr=error.message;render();return;}state.mission=data;state.missionName=data.mission_name;state.setupComplete=true;view.screen='home';render();},
 async handleUpload(e){const files=[...e.target.files];if(!files.length)return;view.busy=true;render();try{const images=[];for(const f of files)images.push(await compressImage(f));const {error}=await sb.from('submissions').insert({mission_id:state.mission?.id,user_id:state.user.id,type:'photo',images,status:'pending'});if(error)throw error;await loadData();view.authError='';}catch(err){view.authError=err.message||'Upload failed.';}view.busy=false;render();},
 async submitTextLog(){const day=document.getElementById('f-day')?.value||'';const start=document.getElementById('f-start')?.value||'';const end=document.getElementById('f-end')?.value||'';if(!day||!start||!end){view.authError='Enter the day, start time, and end time.';render();return;}view.busy=true;render();const {error}=await sb.from('submissions').insert({mission_id:state.mission?.id,user_id:state.user.id,type:'text',day,start_time:start,end_time:end,status:'pending'});view.busy=false;if(error)view.authError=error.message;else{view.authError='';view.draftDay='';view.draftStart='';view.draftEnd='';await loadData();}render();},
 async decide(id,status){view.busy=true;render();const {error}=await sb.from('submissions').update({status}).eq('id',id);if(error)view.authError=error.message;else await loadData();view.busy=false;render();},
 openModal(id,idx){const s=state.submissions.find(x=>x.id===id);if(!s||!s.images?.[idx])return;const ov=document.createElement('div');ov.className='modal-overlay';ov.onclick=()=>ov.remove();ov.innerHTML=`<img src="${s.images[idx]}" alt="Proof photo">`;document.body.appendChild(ov);},
 async resetMission(){if(!confirm('Reset all progress and submissions?'))return;view.busy=true;render();const {error}=await sb.from('submissions').delete().eq('mission_id',state.mission?.id);if(!error){await sb.from('missions').update({start_date:null}).eq('id',state.mission?.id);await loadData();}else view.authError=error.message;view.busy=false;render();}
};
async function loadProfile(){const {data,error}=await sb.from('profiles').select('*').eq('id',state.user.id).maybeSingle();if(error){view.authError=error.message;return;}state.profile=data;await loadData();}
async function loadData(){const {data:m}=await sb.from('missions').select('*').order('created_at',{ascending:false}).limit(1).maybeSingle();state.mission=m;state.missionName=m?.mission_name||DEFAULT_NAME;state.startDate=m?.start_date||null;state.setupComplete=!!m;const {data:s,error}=await sb.from('submissions').select('*').order('created_at',{ascending:true});if(!error)state.submissions=(s||[]).map(x=>({id:x.id,userId:x.user_id,status:x.status,type:x.type,images:x.images||[],day:x.day,startTime:x.start_time,endTime:x.end_time,ts:x.created_at}));}
sb.auth.onAuthStateChange((_event,session)=>{if(session&&!state.user){state.user=session.user;loadProfile().then(()=>{view.screen='home';render();});}});
window.Ascent=Ascent;Ascent.load();
</script>
