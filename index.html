<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#211811">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="自律">
<link rel="icon" type="image/svg+xml" href="./jiritsu-icon.svg">
<title>自律 — Workout Log</title>
<style>
:root{color-scheme:dark;--bg:#211811;--panel:#302319;--panel2:#3c2c20;--line:#72583d;--purple:#8d6bb0;--purple2:#cbb3df;--gold:#e8b45c;--text:#eadcc3;--muted:#aa9274;--danger:#d98a7c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#38271f 0,#211811 58%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:0 auto;padding:28px 18px 64px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}.brand{font-size:13px;letter-spacing:.22em;color:var(--purple2);font-weight:800}.brand span{color:var(--gold);margin-left:8px}.tag{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}.hero{margin:18px 0 28px}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}.hero h1{font-size:clamp(34px,8vw,52px);line-height:1;margin:10px 0;color:var(--text);letter-spacing:-.04em}.hero p{color:var(--muted);margin:10px 0 0;font-size:14px}.primary{background:var(--purple);color:#fff;border:1px solid #b79bd0;padding:14px 18px;font-weight:800;letter-spacing:.04em;border-radius:3px;width:100%;transition:filter .15s}.primary:hover{filter:brightness(1.12)}.secondary{background:transparent;border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:3px;font-size:12px;font-weight:700}.danger{color:var(--danger);border-color:#89574d}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 12px}.section-head h2{font-size:15px;letter-spacing:.12em;text-transform:uppercase;margin:0}.count{font-size:11px;color:var(--muted)}.card{background:linear-gradient(145deg,rgba(60,44,32,.94),rgba(43,31,23,.96));border:1px solid var(--line);padding:16px;margin-bottom:12px;border-radius:3px}.session-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.session-title{font-size:16px;font-weight:800}.session-meta{font-size:12px;color:var(--muted);margin-top:5px}.badge{border:1px solid #7a6147;color:var(--gold);font-size:10px;letter-spacing:.1em;padding:5px 7px;text-transform:uppercase;white-space:nowrap}.exercise-row{padding:13px 0;border-top:1px solid rgba(114,88,61,.5);margin-top:12px}.exercise-name{font-weight:750;font-size:14px}.exercise-variation{font-size:12px;color:var(--purple2);margin-top:3px}.exercise-stats{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted);margin-top:7px}.card-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.empty{padding:32px 18px;text-align:center;border:1px dashed var(--line);color:var(--muted);font-size:13px}.overlay{position:fixed;inset:0;background:rgba(12,8,5,.78);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px;z-index:5}.overlay.open{display:flex}.modal{width:min(100%,650px);background:var(--bg);border:1px solid var(--line);padding:20px;margin:auto 0;box-shadow:0 20px 70px #0008}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.modal h2{font-size:20px;margin:0}.x{border:0;background:none;color:var(--muted);font-size:26px;padding:0 4px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:750}.field input,.field select,.field textarea{width:100%;min-height:44px;background:#1b130e;color:var(--text);border:1px solid var(--line);border-radius:2px;padding:10px 11px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--purple2)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.exercise-editor{border:1px solid var(--line);padding:13px;margin:14px 0;background:#2b1e15}.editor-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.editor-top strong{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}.small-link{background:none;border:0;color:var(--purple2);font-size:12px;text-decoration:underline}.form-error{color:var(--danger);font-size:12px;min-height:18px;margin:8px 0}.modal-actions{display:flex;gap:10px;margin-top:14px}.modal-actions>*{flex:1}.footnote{font-size:11px;color:var(--muted);text-align:center;margin-top:28px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#eadcc3;color:#211811;padding:11px 16px;font-size:13px;font-weight:750;z-index:10;display:none;max-width:calc(100vw - 30px)}@media(min-width:560px){.app{padding-top:40px}.primary{width:auto;min-width:230px}.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.hero{flex:1}.hero-row>.primary{margin-bottom:4px}.grid.three{grid-template-columns:repeat(3,1fr)}}@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}.modal{padding:15px}.app{padding-left:13px;padding-right:13px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand">自律 <span>JIRITSU</span></div><div class="tag">Workout log</div></header>
<div class="hero-row"><section class="hero"><div class="eyebrow">Consistency over intensity</div><h1>Workout Log</h1><p>Record your sessions, exercises, sets, reps, and weight.</p></section><button class="primary" id="add-workout">＋ &nbsp; ADD WORKOUT</button></div>
<div class="section-head"><h2>Workout history</h2><span class="count" id="session-count">0 sessions</span></div>
<section id="history" aria-live="polite"></section>
<div class="footnote">Your workout history is saved in this browser on this device.</div>
</main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title"><section class="modal">
<div class="modal-head"><h2 id="modal-title">Add workout</h2><button class="x" id="close-modal" aria-label="Close">×</button></div>
<form id="workout-form">
<div class="grid">
<div class="field"><label for="workout-date">Date</label><input id="workout-date" type="date" required></div>
<div class="field"><label for="workout-name">Workout name</label><input id="workout-name" placeholder="e.g. Upper body" maxlength="70"></div>
</div>
<div class="field"><label for="workout-notes">Notes (optional)</label><textarea id="workout-notes" rows="2" placeholder="How did the session go?"></textarea></div>
<div class="section-head"><h2>Exercises</h2><button class="secondary" type="button" id="add-exercise">＋ Add exercise</button></div>
<div id="exercise-list"></div>
<div class="form-error" id="form-error" role="alert"></div>
<div class="modal-actions"><button type="button" class="secondary" id="cancel-workout">Cancel</button><button type="submit" class="primary">SAVE WORKOUT</button></div>
</form></section></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
const STORAGE_KEY='jiritsu.workouts.v1';
const catalog={
'Bench Press':['Flat','Incline','Decline','Close-Grip','Smith Machine','Dumbbell'],
'Squat':['Back','Front','Goblet','Smith Machine','Hack Squat'],
'Deadlift':['Conventional','Romanian','Sumo','Trap Bar','Stiff-Leg'],
'Overhead Press':['Standing','Seated','Dumbbell','Smith Machine','Arnold Press'],
'Row':['Barbell','Dumbbell','Chest-Supported','Cable','Machine','T-Bar'],
'Lat Pulldown':['Wide-Grip','Close-Grip','Neutral-Grip','Single-Arm'],
'Chest Fly':['Dumbbell','Cable','Machine','Incline Cable'],
'Lateral Raise':['Dumbbell','Cable','Machine'],
'Biceps Curl':['Dumbbell','Barbell','EZ-Bar','Hammer','Cable','Preacher'],
'Triceps Extension':['Cable Pushdown','Overhead Cable','Dumbbell Overhead','Skull Crusher'],
'Leg Press':['45-Degree','Horizontal','Single-Leg'],
'Leg Curl':['Seated','Lying','Standing'],
'Leg Extension':['Machine','Single-Leg'],
'Calf Raise':['Standing','Seated','Leg Press'],
'Pull-Up':['Overhand','Underhand','Neutral-Grip','Assisted'],
'Push-Up':['Standard','Incline','Decline','Close-Grip'],
'Plank':['Forearm','High Plank','Side Plank'],
'Crunch':['Standard','Cable','Reverse'],
'Hip Thrust':['Barbell','Machine','Single-Leg'],
'Other':['']
};
let workouts=readWorkouts(),editingId=null;
const $=id=>document.getElementById(id);
function readWorkouts(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(workouts))}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function prettyDate(v){if(!v)return'Undated';const d=new Date(v+'T12:00:00');return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}
function render(){workouts.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));$('session-count').textContent=workouts.length+' '+(workouts.length===1?'session':'sessions');const root=$('history');if(!workouts.length){root.innerHTML='<div class="empty">No workouts logged yet.<br>Use <b>Add Workout</b> to record your first session.</div>';return}root.innerHTML=workouts.map(w=>'<article class="card"><div class="session-head"><div><div class="session-title">'+safe(w.name||'Workout')+'</div><div class="session-meta">'+safe(prettyDate(w.date))+' · '+(w.exercises||[]).length+' exercises</div></div><span class="badge">'+(w.exercises||[]).reduce((n,e)=>n+(e.sets||[]).length,0)+' sets</span></div>'+(w.notes?'<p class="session-meta">'+safe(w.notes)+'</p>':'')+(w.exercises||[]).map(e=>'<div class="exercise-row"><div class="exercise-name">'+safe(e.exercise)+'</div>'+(e.variation?'<div class="exercise-variation">'+safe(e.variation)+'</div>':'')+'<div class="exercise-stats">'+(e.sets||[]).map((s,i)=>'Set '+(i+1)+': '+safe(s.weight||'0')+' lb × '+safe(s.reps||'0')+' reps').join(' &nbsp; · &nbsp;')+'</div></div>').join('')+'<div class="card-actions"><button class="secondary" data-edit="'+safe(w.id)+'">Edit</button><button class="secondary danger" data-delete="'+safe(w.id)+'">Delete</button></div></article>').join('');}
function exerciseEditor(ex={exercise:'Bench Press',variation:'Flat',sets:[{weight:'',reps:''}]}){const wrap=document.createElement('div');wrap.className='exercise-editor';const index=$('exercise-list').children.length+1;wrap.innerHTML='<div class="editor-top"><strong>Exercise '+index+'</strong><button type="button" class="small-link remove-exercise">Remove</button></div><div class="field"><label>Exercise</label><select class="exercise-select">'+Object.keys(catalog).map(n=>'<option'+(n===ex.exercise?' selected':'')+'>'+safe(n)+'</option>').join('')+'</select></div><div class="field"><label>Variation</label><select class="variation-select"></select></div><div class="sets"></div><button type="button" class="small-link add-set">＋ Add set</button>';const exerciseSel=wrap.querySelector('.exercise-select'),variationSel=wrap.querySelector('.variation-select'),sets=wrap.querySelector('.sets');function updateVariations(selected){const opts=catalog[exerciseSel.value]||[''];variationSel.innerHTML=opts.map(v=>'<option value="'+safe(v)+'"'+(v===selected?' selected':'')+'>'+safe(v||'Standard')+'</option>').join('');if(!selected&&!opts.includes(''))variationSel.value=opts[0]||''}function addSet(s={weight:'',reps:''}){const row=document.createElement('div');row.className='grid set-row';row.innerHTML='<div class="field"><label>Weight (lb)</label><input class="set-weight" type="number" min="0" step="0.5" inputmode="decimal" placeholder="e.g. 95" value="'+safe(s.weight)+'"></div><div class="field"><label>Reps</label><input class="set-reps" type="number" min="1" step="1" inputmode="numeric" placeholder="e.g. 10" value="'+safe(s.reps)+'"></div>';sets.appendChild(row)}updateVariations(ex.variation);(ex.sets&&ex.sets.length?ex.sets:[{weight:'',reps:''}]).forEach(addSet);exerciseSel.addEventListener('change',()=>updateVariations(''));wrap.querySelector('.add-set').addEventListener('click',()=>addSet());wrap.querySelector('.remove-exercise').addEventListener('click',()=>{wrap.remove();renumber()});wrap.getData=()=>({exercise:exerciseSel.value,variation:variationSel.value,sets:[...sets.querySelectorAll('.set-row')].map(r=>({weight:r.querySelector('.set-weight').value.trim(),reps:r.querySelector('.set-reps').value.trim()}))});return wrap}
function renumber(){[...$('exercise-list').children].forEach((e,i)=>e.querySelector('strong').textContent='Exercise '+(i+1))}
function openModal(w){editingId=w?.id||null;$('modal-title').textContent=w?'Edit workout':'Add workout';$('workout-date').value=w?.date||new Date().toLocaleDateString('en-CA');$('workout-name').value=w?.name||'';$('workout-notes').value=w?.notes||'';$('exercise-list').innerHTML='';(w?.exercises?.length?w.exercises:[{exercise:'Bench Press',variation:'Flat',sets:[{weight:'',reps:''}]}]).forEach(e=>$('exercise-list').appendChild(exerciseEditor(e)));$('form-error').textContent='';$('overlay').classList.add('open');document.body.style.overflow='hidden'}
function closeModal(){$('overlay').classList.remove('open');document.body.style.overflow='';editingId=null}
function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
$('add-workout').addEventListener('click',()=>openModal());$('close-modal').addEventListener('click',closeModal);$('cancel-workout').addEventListener('click',closeModal);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('add-exercise').addEventListener('click',()=>{$('exercise-list').appendChild(exerciseEditor());renumber()});
$('workout-form').addEventListener('submit',e=>{e.preventDefault();const exercises=[...$('exercise-list').children].map(el=>el.getData());if(!exercises.length){$('form-error').textContent='Add at least one exercise.';return}for(let i=0;i<exercises.length;i++){if(!exercises[i].sets.length||exercises[i].sets.some(s=>!s.reps||Number(s.reps)<1||s.weight===''||Number(s.weight)<0)){$('form-error').textContent='Enter a valid weight and rep count for every set (use 0 lb for bodyweight exercises).';return}}const data={id:editingId||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now())),date:$('workout-date').value,name:$('workout-name').value.trim()||'Workout',notes:$('workout-notes').value.trim(),exercises,createdAt:Date.now()};if(editingId){const i=workouts.findIndex(w=>w.id===editingId);if(i>=0){data.createdAt=workouts[i].createdAt||Date.now();workouts[i]=data}}else workouts.push(data);try{persist()}catch(err){$('form-error').textContent='Could not save workout in this browser. Check available storage.';return}closeModal();render();toast('Workout saved')});
$('history').addEventListener('click',e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit){const w=workouts.find(w=>w.id===edit.dataset.edit);if(w)openModal(w)}if(del){const w=workouts.find(w=>w.id===del.dataset.delete);if(w&&confirm('Delete this workout and its exercise details?')){workouts=workouts.filter(x=>x.id!==w.id);persist();render();toast('Workout deleted')}}});
render();
})();
</script>
</body>
</html>
